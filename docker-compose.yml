version: '3.8'

services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.8.0
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    ports:
      - "9200:9200"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.http.pemcert_filepath=/usr/share/wazuh-indexer/certs/indexer.pem
      - plugins.security.ssl.http.pemkey_filepath=/usr/share/wazuh-indexer/certs/indexer-key.pem
      - plugins.security.ssl.http.pemtrustedcas_filepath=/usr/share/wazuh-indexer/certs/root-ca.pem
      - plugins.security.ssl.transport.enforce_hostname_verification=false
      - plugins.security.ssl.transport.resolve_hostname=false
      - plugins.security.authcz.admin_dn="CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
      - plugins.security.ssl.transport.pemcert_filepath=/usr/share/wazuh-indexer/certs/indexer.pem
      - plugins.security.ssl.transport.pemkey_filepath=/usr/share/wazuh-indexer/certs/indexer-key.pem
      - plugins.security.ssl.transport.pemtrustedcas_filepath=/usr/share/wazuh-indexer/certs/root-ca.pem
      - plugins.security.nodes_dn="CN=wazuh.indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
      - cluster.initial_master_nodes=wazuh.indexer
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer/opensearch.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./certs:/usr/share/wazuh-indexer/certs
    networks:
      - wazuh-net

  wazuh.manager:
    image: wazuh/wazuh-manager:4.8.0
    container_name: wazuh.manager
    hostname: wazuh.manager
    depends_on:
      - wazuh.indexer
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - ./config/wazuh_manager/ossec.conf:/var/ossec/etc/ossec.conf
      - ./config/wazuh_manager/local_rules.xml:/var/ossec/etc/rules/local_rules.xml
      - ./config/wazuh_manager/decoder.xml:/var/ossec/etc/decoders/local_decoder.xml
      - ./scripts/custom-telegram.sh:/var/ossec/integrations/custom-telegram
      - ./certs:/etc/filebeat/certs
    networks:
      - wazuh-net

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    ports:
      - "5601:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager:55000
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./certs:/usr/share/wazuh-dashboard/certs
    networks:
      - wazuh-net

volumes:
  wazuh-indexer-data:
  wazuh-manager-data:

networks:
  wazuh-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
